<!doctype html><html><body style="margin:0"><canvas id="c" width="1440" height="1440"></canvas><script>
// Stand-in for the Pexels clip: warm plaster wall + plant shadows swaying. Replace with the real footage (prepare-footage.sh).
const c=document.getElementById('c'),g=c.getContext('2d');
window.draw=(t)=>{
  const gr=g.createRadialGradient(430,290,50,600,600,1500);gr.addColorStop(0,'#f1e8da');gr.addColorStop(.55,'#e3d6c2');gr.addColorStop(1,'#cbb9a0');
  g.fillStyle=gr;g.fillRect(0,0,1440,1440);
  // plaster grain (deterministic)
  let s=1234567;const rnd=()=>{s=(s*16807)%2147483647;return s/2147483647};
  g.fillStyle='rgba(120,100,70,.035)';for(let i=0;i<9000;i++){g.fillRect(rnd()*1440,rnd()*1440,1.6,1.6)}
  g.save();g.filter='blur(10px)';g.globalCompositeOperation='multiply';g.fillStyle='rgba(120,102,80,.55)';g.strokeStyle='rgba(120,102,80,.55)';
  const sway=Math.sin(t*1.3)*.035+Math.sin(t*2.9)*.012;
  g.translate(1440,-60);g.rotate(sway);
  g.lineWidth=12;g.beginPath();g.moveTo(0,0);g.bezierCurveTo(-200,360,-260,760,-430,1560);g.stroke();
  for(let i=0;i<28;i++){const k=i/28,x=-30-k*400+Math.sin(i*2.1)*150,y=60+k*1400+Math.cos(i*1.7)*50,a=(-40+(i*37)%90)*Math.PI/180+Math.sin(t*2+i)*.12;
    g.save();g.translate(x,y);g.rotate(a);g.beginPath();g.ellipse(0,0,70+(i%4)*18,22+(i%3)*6,0,0,7);g.fill();g.restore();}
  g.restore();
};
</script></body></html>
